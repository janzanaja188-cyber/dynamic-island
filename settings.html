<div class="st-screentime-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>⏱️ Screen Time Stats</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="screentime_idle_timeout">
                หยุดนับเวลาอัตโนมัติเมื่อไม่ขยับเมาส์/พิมพ์ (นาที)
            </label>
            <input id="screentime_idle_timeout" class="text_pole" type="number" min="1" max="60" value="5" />
            <small>ระบบจะบันทึกสถิติรายตัวละครแบบถาวร (Lifetime Data)</small>
            
            <hr style="margin: 15px 0; border-color: var(--SmartThemeBorder);">
            
            <div style="display: flex; justify-content: center; padding-bottom: 10px;">
                <button id="screentime_show_dashboard" class="menu_button" style="width: 100%; font-weight: bold;">
                    <i class="fa-solid fa-chart-column"></i> เปิดหน้าต่างสถิติ (Dashboard)
                </button>
            </div>
        </div>
    </div>
</div>
