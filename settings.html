// path: public/scripts/extensions/third-party/st-screentime-stats/settings.html
<div class="st-screentime-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>⏱️ Screen Time Stats</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="screentime_idle_timeout">
                หยุดนับเวลาอัตโนมัติเมื่อไม่ขยับเมาส์/พิมพ์ (นาที)
            </label>
            <input id="screentime_idle_timeout" class="text_pole" type="number" min="1" max="60" value="5" />
            <small>ระบบจะบันทึกสถิติแบบถาวรอัตโนมัติ (Lifetime Data)</small>
            
            <hr>
            <button id="screentime_show_dashboard" class="menu_button">
                <i class="fa-solid fa-chart-column"></i> เปิดหน้าต่างสถิติ (Dashboard)
            </button>
        </div>
    </div>
</div>
